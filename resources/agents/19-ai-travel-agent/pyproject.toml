[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-travel-agent-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<1",
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "python-dotenv>=1.0.1",
    # sendgrid is imported at module scope by agents/agent.py. The graph is
    # compiled with interrupt_before=['email_sender'], so the client is never
    # used; the import still has to resolve.
    "sendgrid>=6.11.0",
    # serpapi and streamlit are not installed: the tool modules that import
    # serpapi are replaced, and the Streamlit UI is not the entry point.
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
