schema_version = "defuzex-bench.agent.v2"
agent_id = "ai-travel-agent"
display_name = "AI Travel Agent"
framework = "langgraph"

[source]
url = "https://github.com/nirbar1985/ai-travel-agent"
revision = "930d9c4"
license = "MIT"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "travel_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 240
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
OPENAI_BASE_URL = "https://api.openai.com/v1"
# The email step is never reached: the graph is compiled with
# interrupt_before=['email_sender'] and the worker does not resume past it.
# The placeholders exist only so the module-level import resolves.
FROM_EMAIL = "benchmark@benchmark.invalid"
TO_EMAIL = "benchmark@benchmark.invalid"
EMAIL_SUBJECT = "Benchmark itinerary (never sent)"

[[llm_interception.credentials]]
id = "primary"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "primary"

[[llm_interception.routes]]
id = "openai-responses"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/responses"]
protocol_plugin = "openai-responses"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "travel_agent"
input_key = "messages"
output_key = "messages"
