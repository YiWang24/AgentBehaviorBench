[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "react-agent-benchmark"
version = "0.1.0"
description = "AgentBench adaptation of the langchain-ai/react-agent template."
requires-python = ">=3.11"
# Every upstream dependency is kept. langchain-tavily is required even though
# the benchmark replaces the search backend, because react_agent/tools.py
# imports TavilySearch at module level; the vendored source is unchanged.
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=1.3.10",
    "langchain-openai>=1.1.14",
    "langchain-anthropic>=1.4.6",
    "langchain-fireworks>=0.1.7",
    "python-dotenv>=1.2.2",
    "langchain-tavily>=0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["react_agent*", "react_agent_benchmark*", "benchmark_mocks*"]
