[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-rec-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
    "structlog>=24.0",
    # Not installed: redis, pymilvus and SQLAlchemy. The feature store degrades
    # to empty features without a Redis client, the vector store and database
    # are not imported on the graph path, and the catalogue is a fixture.
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
