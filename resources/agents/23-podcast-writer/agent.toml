schema_version = "defuzex-bench.agent.v2"
agent_id = "podcast-writer"
display_name = "Podcast Script Writer"
framework = "langgraph"

[source]
url = "https://github.com/artnoage/Podcast"
revision = "9d0f3c4"
license = "Apache-2.0"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "podcast_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 240
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
OPENAI_BASE_URL = "https://api.openai.com/v1"
PODCAST_MODEL = "gpt-4o-mini"

[[llm_interception.credentials]]
id = "primary"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "podcast"
input_key = "main_text"
output_key = "enhanced_script"
