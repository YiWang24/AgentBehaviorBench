[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3.0,<1",
    "openai>=1.0.0",
    "langchain-openai>=0.3.0,<1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    # core/runtime/__init__.py imports the MQTT client eagerly, so aiomqtt has
    # to resolve even though no broker is ever contacted. No client is started;
    # the egress guard would fail loudly if one were.
    "aiomqtt>=2.3.0",
    # Not installed: fastapi/uvicorn (the HTTP server is not the entry point),
    # amqtt (the bundled broker; devices come from the VirtualAdapter),
    # python-miio (no Xiaomi hardware), matplotlib (plots only).
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# planner_hints.md is read relative to the installed module.
[tool.setuptools.package-data]
"core.brain" = ["prompts/*.md"]
