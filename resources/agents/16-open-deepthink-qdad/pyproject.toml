[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-deepthink-qdad-benchmark"
version = "0.1.0"
description = "AgentBench adaptation of the iblameandrew/open-deepthink QDAD graph."
requires-python = ">=3.11"
# The Flask app, the FAISS retrieval layer, and the code sandbox live outside
# the selected graph. Everything below is reached by importing it.
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tiktoken>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepthink*", "qdad_benchmark*", "benchmark_mocks*"]
