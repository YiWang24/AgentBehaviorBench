schema_version = "defuzex-bench.agent.v2"
agent_id = "open-deepthink-qdad"
display_name = "open-deepthink Qualitative Diffusion (QDAD)"
framework = "langgraph"

[source]
url = "https://github.com/iblameandrew/open-deepthink"
revision = "b440af1"
license = "MIT"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "qdad_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 300
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
OPENAI_BASE_URL = "https://api.openai.com/v1"
QDAD_MODEL = "gpt-4o-mini"
QDAD_GRID_SIZE = "2"
QDAD_DENOISING_STEPS = "1"
QDAD_STATE_ROOT = "/tmp/open-deepthink"

[[llm_interception.credentials]]
id = "primary"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "primary"

[[llm_interception.routes]]
id = "openai-responses"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/responses"]
protocol_plugin = "openai-responses"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "qdad"
input_key = "user_prompt"
output_key = "final_solution"
