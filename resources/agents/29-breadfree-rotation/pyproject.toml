[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breadfree-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<1",
    "openai>=1.20",
    "pandas>=2.0",
    "numpy>=1.26",
    # utils/metrics.py uses scipy.stats for the trend regression.
    "scipy>=1.12",
    "pyyaml>=6.0",
    # Not installed: the market-data and news layers (curl_cffi, akshare,
    # SQLAlchemy) and the plotting stack. The decision graph reads its price
    # series from graph state; those packages are not vendored.
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
