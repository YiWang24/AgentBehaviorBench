schema_version = "defuzex-bench.agent.v2"
agent_id = "mcp-agent"
display_name = "MCP Tool Agent"
framework = "langgraph"

[source]
url = "https://github.com/braincrew-lab/langgraph-mcp-agents"
revision = "d4694e9"
license = "MIT"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "mcp_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 240
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
OPENAI_BASE_URL = "https://api.openai.com/v1"
MCP_MODEL = "gpt-4o"
MCP_CONFIG = "/opt/agent/config.json"
MCP_RECURSION_LIMIT = "25"

[[llm_interception.credentials]]
id = "primary"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "primary"

[[llm_interception.routes]]
id = "openai-responses"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/responses"]
protocol_plugin = "openai-responses"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "mcp_agent"
input_key = "messages"
output_key = "messages"
