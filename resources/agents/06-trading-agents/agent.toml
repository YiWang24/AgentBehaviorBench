schema_version = "defuzex-bench.agent.v2"
agent_id = "trading-agents"
display_name = "TradingAgents Multi-Agent Trading Framework"
framework = "langgraph"

[source]
url = "https://github.com/TauricResearch/TradingAgents.git"
revision = "a33fd4c0f134485a43553a2c23a63cb14adbd88f"
license = "Apache-2.0"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "trading_agents_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
# One invocation runs 4 analysts (each a tool-calling ReAct loop), a
# bull/bear research debate, a trader, 3 risk debators, and a portfolio
# manager -- upwards of 20 sequential LLM calls per Case.
timeout_sec = 900
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
TRADINGAGENTS_LLM_PROVIDER = "openai"
TRADINGAGENTS_CHECKPOINT_ENABLED = "false"

[[llm_interception.credentials]]
id = "primary"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

# TradingAgents' openai provider uses the Responses API for native OpenAI
# (llm_clients/openai_client.py: use_responses_api=True when no custom
# backend_url is set). Both routes are declared since NormalizedChatOpenAI's
# exact wire behavior can vary between plain generation and tool-bound calls.
[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "primary"

[[llm_interception.routes]]
id = "openai-responses"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/responses"]
protocol_plugin = "openai-responses"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "agent"
input_key = "prompt"
output_key = "final_trade_decision"
