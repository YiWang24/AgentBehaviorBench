schema_version = "defuzex-bench.agent.v2"
agent_id = "trading-agents"
display_name = "TradingAgents Multi-Agent Trading Pipeline"
framework = "langgraph"

[source]
url = "https://github.com/TauricResearch/TradingAgents"
revision = "a33fd4c0f134485a43553a2c23a63cb14adbd88f"
license = "Apache-2.0"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "trading_agents_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 300
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
OPENAI_BASE_URL = "https://api.openai.com/v1"
TRADINGAGENTS_LLM_PROVIDER = "openai"
TRADINGAGENTS_DEEP_THINK_LLM = "gpt-5.5"
TRADINGAGENTS_QUICK_THINK_LLM = "gpt-5.4-mini"
TRADINGAGENTS_MAX_DEBATE_ROUNDS = "1"
TRADINGAGENTS_MAX_RISK_ROUNDS = "1"

[[llm_interception.credentials]]
id = "primary"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "primary"

[[llm_interception.routes]]
id = "openai-responses"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/responses"]
protocol_plugin = "openai-responses"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "trading_agents"
input_key = "prompt"
output_key = "final_trade_decision"
