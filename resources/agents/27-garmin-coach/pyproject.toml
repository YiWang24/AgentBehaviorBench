[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-coach-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "langchain-anthropic>=0.3,<2",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    # Not installed: the Garmin and Outside clients' HTTP libraries beyond what
    # langchain pulls in, and the CLI's presentation dependencies. The analysis
    # workflow reads its data from graph state.
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
