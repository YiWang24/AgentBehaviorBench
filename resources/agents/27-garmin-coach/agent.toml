schema_version = "defuzex-bench.agent.v2"
agent_id = "garmin-coach"
display_name = "Endurance Training Coach"
framework = "langgraph"

[source]
url = "https://github.com/leonzzz435/garmin-ai-coach"
revision = "54a6494"
license = "MIT"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "coach_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 420
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
# cost_effective assigns a plain Anthropic model to every role. The other
# modes use gpt-5-search / gpt-5.2-pro-search, which carry a server-side
# {"type": "web_search"} tool that needs real OpenAI egress the benchmark
# does not have.
AI_MODE = "cost_effective"
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
COACH_TODAY = "2026-08-24"
COACH_RECURSION_LIMIT = "40"

[[llm_interception.credentials]]
id = "primary"
agent_env = "ANTHROPIC_API_KEY"
auth_plugin = "anthropic-api-key"

[[llm_interception.routes]]
id = "anthropic-messages"
host_patterns = ["api.anthropic.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/messages"]
protocol_plugin = "anthropic-messages"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "training_analysis"
input_key = "analysis_context"
output_key = "synthesis_result"
