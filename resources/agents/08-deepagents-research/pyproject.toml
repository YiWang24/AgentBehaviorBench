[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagents-research-benchmark"
version = "0.1.0"
description = "AgentBench adaptation of the langchain-ai/deepagents deep-research example."
requires-python = ">=3.11"
# The deepagents library is vendored at the pinned revision rather than pulled
# from PyPI, so its own declared dependencies are listed here. Notebook and CLI
# extras from the example (jupyter, ipykernel, rich, langgraph-cli) are not
# reached by the selected graph and are omitted.
dependencies = [
    "langchain>=1.3.17,<2.0.0",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-anthropic>=1.6.1,<2.0.0",
    "langchain-google-genai>=4.3.6,<5.0.0",
    "langsmith>=0.11.1",
    "packaging>=23.2",
    "wcmatch>=11.0",
    "tavily-python>=0.7.26",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepagents*", "research_agent*", "deep_research_benchmark*", "benchmark_mocks*"]

[tool.setuptools.package-data]
deepagents = ["py.typed"]
