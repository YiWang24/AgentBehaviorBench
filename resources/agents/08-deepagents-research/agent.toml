schema_version = "defuzex-bench.agent.v2"
agent_id = "deepagents-research"
display_name = "DeepAgents Deep Research Agent"
framework = "langgraph"

[source]
url = "https://github.com/langchain-ai/deepagents"
revision = "92e15dc0cb6d39fce1024483c30408f1b33e7549"
license = "MIT"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "deep_research_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 300
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
DEEP_RESEARCH_STATE_ROOT = "/tmp/deep-research"

[[llm_interception.credentials]]
id = "primary"
agent_env = "ANTHROPIC_API_KEY"
auth_plugin = "anthropic-api-key"

[[llm_interception.routes]]
id = "anthropic-messages"
host_patterns = ["api.anthropic.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/messages"]
protocol_plugin = "anthropic-messages"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "research"
input_key = "messages"
output_key = "messages"
