schema_version = "defuzex-bench.agent.v2"
agent_id = "event-deep-research"
display_name = "15 event-deep-research"
framework = "langgraph"

[evaluation]
replay_safe = true

[source]
repository = "https://github.com/bernatsampera/event-deep-research"
revision = "local-snapshot"
downloaded_on = "2026-09-15"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 900
secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/run/agentbench-tools"

[adapter]
type = "langgraph"
mode = "in_process"
config = "abb-langgraph.json"
graph_id = "agent"
input_key = "message"
binding = "agent_binding.py:create_graph"

[observe]
input_fields = [{name = "message", label = "Request", required = true}]

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
