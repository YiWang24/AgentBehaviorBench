[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-pipeline-benchmark"
version = "0.1.0"
description = "AgentBench adaptation of the bcefghj/medical-multi-agent-system clinical decision pipeline."
requires-python = ">=3.11"
# The FastAPI service, Neo4j, Postgres, and Redis are not reached by the graph:
# the drug-interaction table and ICD-10 index ship as Python literals and the
# GraphRAG service defaults to its in-memory backend.
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["clinical_agent*", "clinical_benchmark*", "benchmark_mocks*"]
