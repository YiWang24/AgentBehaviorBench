[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcube-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "python-docx==1.1.2",
    "PyMuPDF>=1.24,<2",
    "python-dotenv>=1.0",
    # Not installed: fastapi/uvicorn/sse-starlette (the HTTP API is not the
    # entry point), chromadb / faiss-cpu / langchain-huggingface (the vector
    # store is not on the drafting graph path), Pillow / pdf2image (image
    # helpers not reached by the text draft flow).
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
