schema_version = "defuzex-bench.agent.v2"
agent_id = "readwren-interview"
display_name = "WREN Literary Interview"
framework = "langgraph"

[source]
url = "https://github.com/muratcankoylan/readwren"
revision = "3d0bfe4"
license = "MIT"

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "wren_benchmark.worker"]
input_mode = "jsonl"
output_format = "jsonl"
workdir = "/opt/agent"

[runtime]
type = "docker"
timeout_sec = 240
env_keys = []
secret_env_keys = []

[llm_interception]
required = true
trust_plugin = "pem-env"

[llm_interception.environment]
# The agent talks to Moonshot's OpenAI-compatible endpoint (Kimi models). It
# speaks the OpenAI chat wire protocol, so the openai-chat plugin captures it.
MOONSHOT_BASE_URL = "https://api.moonshot.cn/v1"

[[llm_interception.credentials]]
id = "primary"
agent_env = "MOONSHOT_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "moonshot-chat"
host_patterns = ["api.moonshot.cn"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "primary"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "interview"
input_key = "messages"
output_key = "messages"
